[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "dotmaster"
dynamic = ["version"]
description = "Interactive dotfile generator and manager for any project"
readme = "README.md"
license = { text = "MIT" }

requires-python = ">=3.10"
authors = [{ name = "dotmaster contributors" }]
keywords = ["dotfiles", "cli", "developer-tools", "configuration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "InquirerPy>=0.3.4",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tomlkit>=0.12.0",
    "pydantic>=2.6.0",
    "platformdirs>=4.0.0",
]

[project.urls]
Repository = "https://github.com/ahron-maslin/dotmaster"
Issues = "https://github.com/ahron-maslin/dotmaster/issues"
Changelog = "https://github.com/ahron-maslin/dotmaster/blob/main/CHANGELOG.md"


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "syrupy>=4.6.1",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pyyaml",
]

[project.scripts]
dotmaster = "dotmaster.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["dotmaster"]

[tool.hatch.envs.dev]
features = [
    "dev",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "dotmaster/_version.py"

[project.entry-points."dotmaster.plugins"]
# Third-party plugins register here, e.g.:
# terraform = "dotmaster_terraform:TerraformPlugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"
# Markdown files (notably REVIEW.md) quote old, intentionally-unfixed code as
# historical examples of bugs; ruff must never "fix" code inside a docs quote.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
